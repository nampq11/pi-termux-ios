<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>pi mobile — Spaces</title><link rel="stylesheet" href="style.css"></head>
<body data-page="spaces"><header><div id="menubar"></div></header><main id="keys-page">
<div class="section-hdr">Gerät koppeln</div><form id="prepare" class="card">
<label>Eigene NetBird Peer-ID<input name="peerId" required autocomplete="off"></label>
<label>Vertrauenswürdige Control Host-ID<input name="controlHostId" required autocomplete="off"></label>
<label>Control-Endpunkt<input name="endpoint" placeholder="tcp://100.x.x.x:PORT" required autocomplete="off"></label>
<button type="submit">Geräteschlüssel im Android Keystore anlegen</button></form>
<form id="pair" class="card"><label>Enrollment-QR-Inhalt oder Token<textarea id="enroll-token" rows="3" autocomplete="off" spellcheck="false"></textarea></label><button type="submit">Koppeln</button></form>
<div class="card"><button data-action="enrollStatus">Kopplungsstatus prüfen</button><button data-action="authenticate">Schlüsselbeweis prüfen</button><button data-action="rotate">Schlüssel rotieren</button><button data-action="rotationStatus">Rotation auswerten</button></div>
<div class="section-hdr">Space verbinden</div><form id="data" class="card">
<label>Vertrauenswürdige Data Host-ID<input name="hostId" required autocomplete="off"></label><label>Data-Endpunkt<input name="endpoint" placeholder="tcp://100.x.x.x:PORT" required autocomplete="off"></label><label>Space-ID oder Alias<input name="space" required autocomplete="off"></label><button type="submit">Host und Space speichern</button></form>
<div class="card"><button data-action="objects">Space und Objekte anzeigen</button></div>
<div class="card"><a href="spacectl.html">Läufe, Worker und Vorgänge steuern</a></div>
<p id="space-message" role="status" class="key-empty"></p><pre id="space-result" style="white-space:pre-wrap;overflow-wrap:anywhere;padding:12px"></pre>
</main><script type="module" src="spaces.js"></script></body></html>
