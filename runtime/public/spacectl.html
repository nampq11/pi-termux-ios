<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>pi mobile — Steuerung</title><link rel="stylesheet" href="style.css"></head>
<body data-page="spacectl"><header><div id="menubar"></div></header><main id="keys-page">
<p class="key-empty">Aufträge gehen als Admin-Commands an den Koordinator. Erfolg wird erst nach dessen Ergebnis angezeigt; bei Zeitüberschreitung bleibt die Auftrags-ID erhalten.</p>
<p id="ctl-message" role="status" class="key-empty"></p>

<div class="section-hdr">Hinweise</div>
<div class="card"><button data-load="alerts">Hinweise laden</button></div>
<div id="alerts"></div>

<div class="section-hdr">Vorgänge</div>
<div class="card"><button data-load="operations">Vorgänge aktualisieren</button></div>
<div id="operations"></div>

<div class="section-hdr">Läufe</div>
<div class="card"><button data-load="runs">Läufe laden</button></div>
<div id="runs"></div>
<form id="sieve" class="card">
<label>Lauf-ID<input name="runId" required pattern="[a-zA-Z0-9][a-zA-Z0-9._:-]{0,95}" autocomplete="off"></label>
<label>Start<input name="start" type="number" min="0" value="1" required></label>
<label>Exklusive Obergrenze<input name="end" type="number" min="2" value="1001" required></label>
<label>Blockgröße<input name="blockSize" type="number" min="1" max="4096" value="128" required></label>
<label>Space-IDs der Members (kommagetrennt)<input name="members" required autocomplete="off"></label>
<button type="submit">Primzahlsieb starten</button></form>

<div class="section-hdr">Worker</div>
<div class="card"><button data-load="workers">Worker laden</button></div>
<div id="workers"></div>
<form id="setworkers" class="card">
<label>Zuweisung<input name="assignmentId" required autocomplete="off"></label>
<label>Host-ID<input name="hostId" required autocomplete="off"></label>
<label>Workerart<input name="kind" value="sieve" required autocomplete="off"></label>
<label>Ziel-Space-ID<input name="targetSpace" required autocomplete="off"></label>
<label>Lauf-ID (optional)<input name="runId" autocomplete="off"></label>
<label>Anzahl (0 stoppt nach dem laufenden Task)<input name="count" type="number" min="0" max="64" value="1" required></label>
<button type="submit">Anzahl setzen</button></form>

<div class="section-hdr">Spaces</div>
<form id="space-create" class="card">
<label>Host-ID<input name="hostId" required autocomplete="off"></label>
<label>Alias<input name="alias" required pattern="[a-z0-9][a-z0-9._-]{0,63}" autocomplete="off"></label>
<button type="submit">Space anlegen oder vorhandenen wiederverwenden</button></form>
<form id="space-change" class="card">
<label>Host-ID<input name="hostId" required autocomplete="off"></label>
<label>Space-ID<input name="spaceId" required autocomplete="off"></label>
<button type="submit" value="archiveSpace">Archivieren</button><button type="submit" value="reactivateSpace">Reaktivieren</button><button type="submit" value="deleteSpace">Löschen</button></form>

<div class="section-hdr">Deployment</div>
<form id="deployment" class="card">
<label>Deployment-Config (JSON, ohne Geheimnisse)<textarea name="config" rows="6" spellcheck="false" autocomplete="off"></textarea></label>
<button type="submit" value="planDeployment">Plan anzeigen</button><button type="submit" value="exportDeployment">Angewendeten Stand exportieren</button></form>
<div id="deployment-result"></div>

<div class="section-hdr">Audit</div>
<div class="card"><button data-load="audit">Letzte Admin-Aufträge laden</button></div>
<div id="audit"></div>
</main><script type="module" src="spacectl.js"></script></body></html>
